<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio Analyst</title>
<style>
  :root {
    --wa-green: #075e54;
    --wa-teal: #128c7e;
    --wa-bubble-out: #dcf8c6;
    --wa-bubble-in: #ffffff;
    --wa-bg: #e5ddd5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    height: 100vh; display: flex; background: #f0f0f0;
  }
  /* Sidebar: contact list */
  #sidebar {
    width: 320px; background: #fff; border-right: 1px solid #ddd;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  #sidebar-header {
    background: var(--wa-green); color: #fff; padding: 16px;
    font-size: 18px; font-weight: 600;
  }
  #contacts { overflow-y: auto; flex: 1; }
  .contact {
    padding: 14px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px;
  }
  .contact:hover { background: #f5f5f5; }
  .contact.active { background: #e9e9e9; }
  .contact-name { font-weight: 600; color: #222; }
  .contact-city { font-size: 13px; color: #888; }

  /* Chat area */
  #chat-area { flex: 1; display: flex; flex-direction: column; }
  #chat-header {
    background: var(--wa-green); color: #fff; padding: 14px 20px;
    font-size: 16px; font-weight: 600;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 20px; background: var(--wa-bg);
    display: flex; flex-direction: column; gap: 8px;
  }
  .bubble {
    max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px;
    line-height: 1.4; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,.1);
  }
  .bubble.user { align-self: flex-end; background: var(--wa-bubble-out); }
  .bubble.assistant { align-self: flex-start; background: var(--wa-bubble-in); }
  .bubble.pending { align-self: flex-start; background: var(--wa-bubble-in); color: #999; font-style: italic; }
  .bubble.error { align-self: flex-start; background: #ffdddd; color: #a00; }

  #input-row {
    display: flex; gap: 8px; padding: 12px; background: #f0f0f0;
  }
  #input-row input {
    flex: 1; padding: 12px 16px; border-radius: 20px; border: none; font-size: 14.5px;
  }
  #input-row button {
    background: var(--wa-teal); color: #fff; border: none; border-radius: 50%;
    width: 44px; height: 44px; cursor: pointer; font-size: 18px;
  }
  #input-row button:disabled { opacity: 0.5; cursor: default; }
  #empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 15px; background: var(--wa-bg);
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">Portfolio Analyst</div>
  <div id="contacts"></div>
</div>

<div id="chat-area">
  <div id="empty-state">Select a user on the left to start chatting</div>
</div>

<script>
const API_BASE = ""; // same-origin; set to e.g. "http://localhost:8000" if serving statically elsewhere

let currentUser = null;
let conversationId = null;

async function loadContacts() {
  const res = await fetch(`${API_BASE}/users`);
  const users = await res.json();
  const el = document.getElementById("contacts");
  el.innerHTML = "";
  users.forEach(u => {
    const div = document.createElement("div");
    div.className = "contact";
    div.dataset.userId = u.user_id;
    div.innerHTML = `<div class="contact-name">${u.name}</div><div class="contact-city">${u.city}</div>`;
    div.onclick = () => selectUser(u, div);
    el.appendChild(div);
  });
}

function selectUser(user, contactEl) {
  document.querySelectorAll(".contact").forEach(c => c.classList.remove("active"));
  contactEl.classList.add("active");
  currentUser = user;
  conversationId = null;

  document.getElementById("chat-area").innerHTML = `
    <div id="chat-header">${user.name}</div>
    <div id="messages"></div>
    <div id="input-row">
      <input id="msg-input" type="text" placeholder="Type a message" autocomplete="off" />
      <button id="send-btn">&#10148;</button>
    </div>
  `;
  document.getElementById("send-btn").onclick = sendMessage;
  document.getElementById("msg-input").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  loadHistory(user.user_id);
}

async function loadHistory(userId) {
  try {
    const res = await fetch(`${API_BASE}/conversations/current?user_id=${encodeURIComponent(userId)}`);
    const data = await res.json();
    conversationId = data.conversation_id;
    data.messages.forEach(m => appendBubble(m.content, m.role));
  } catch (err) {
    // no prior conversation, or fetch failed — just start fresh silently
  }
}

function appendBubble(text, cls) {
  const messages = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `bubble ${cls}`;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function sendMessage() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || !currentUser) return;
  input.value = "";

  // Capture which user/conversation this request is actually for. If the
  // person switches to a different contact before the (slow) reply comes
  // back, we must NOT render it into whatever chat is now on screen, and
  // must NOT overwrite the global conversationId with this stale request's
  // result — both were causing replies to visually leak into the wrong
  // conversation, and could corrupt which conversation subsequent messages
  // for the *new* contact were posted to.
  const requestedUserId = currentUser.user_id;
  const requestedConversationId = conversationId;

  const sendBtn = document.getElementById("send-btn");
  if (sendBtn) sendBtn.disabled = true;

  appendBubble(text, "user");
  const pending = appendBubble("...", "pending");

  const stillSameContact = () => currentUser && currentUser.user_id === requestedUserId;

  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: requestedUserId,
        conversation_id: requestedConversationId,
        message: text,
      }),
    });
    const data = await res.json();

    if (stillSameContact()) {
      pending.remove();
      if (!res.ok) {
        appendBubble(data.detail || "Something went wrong.", "error");
      } else {
        conversationId = data.conversation_id;
        appendBubble(data.reply, "assistant");
      }
    }
    // If they've switched contacts, the reply is already safely saved
    // server-side under the right conversation — it'll appear next time
    // they open that contact. We deliberately touch nothing here.
  } catch (err) {
    if (stillSameContact()) {
      pending.remove();
      appendBubble("Could not reach the server: " + err.message, "error");
    }
  } finally {
    if (stillSameContact() && sendBtn) {
      sendBtn.disabled = false;
    }
  }
}

loadContacts();
</script>
</body>
</html>
